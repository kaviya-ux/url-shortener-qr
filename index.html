<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener & QR Code Generator</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans p-4 sm:p-8">

    <div class="w-full max-w-[600px] mx-auto">

        <!-- HEADER -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🔗 URL Shortener & QR Code Generator</h1>
            <p class="text-gray-500">Shorten any link and get an instant scannable QR code.</p>
        </div>

        <!-- MAIN CARD -->
        <div class="bg-white p-6 sm:p-[30px] rounded-2xl shadow-lg mb-6">

            <label for="urlInput" class="block text-sm font-medium text-gray-700 mb-2">Enter a long URL</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="urlInput" placeholder="https://example.com/some/very/long/link"
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-gray-700 outline-none focus:border-blue-600">
                <button id="shortenBtn" onclick="handleShorten()"
                    class="px-6 py-3 rounded-lg text-white font-medium bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors whitespace-nowrap">
                    Shorten & Generate
                </button>
            </div>

            <!-- ERROR MESSAGE -->
            <p id="errorMessage" class="hidden text-red-600 text-sm mt-3"></p>

            <!-- LOADING STATE -->
            <div id="loadingState" class="hidden items-center gap-2 mt-4 text-gray-500 text-sm">
                <div class="spinner"></div>
                <span>Shortening your link...</span>
            </div>

            <!-- RESULT -->
            <div id="resultBox" class="hidden mt-6 pt-6 border-t border-gray-200">
                <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">

                    <!-- QR CODE -->
                    <div class="flex-shrink-0 bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <img id="qrImage" src="" alt="QR code for shortened URL" class="w-[160px] h-[160px]">
                    </div>

                    <!-- LINK + ACTIONS -->
                    <div class="flex-1 w-full">
                        <p class="text-sm text-gray-500 mb-1">Your shortened link</p>
                        <div class="flex items-center gap-2 mb-4">
                            <input type="text" id="shortUrlOutput" readonly
                                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-blue-600 font-medium bg-gray-50 outline-none">
                            <button onclick="copyToClipboard()"
                                class="px-4 py-2 rounded-lg text-sm text-white font-medium bg-green-600 hover:bg-green-700 transition-colors whitespace-nowrap">
                                Copy
                            </button>
                        </div>
                        <a id="downloadQrLink" href="" download="qr-code.png" target="_blank" rel="noopener"
                            class="inline-block text-sm text-blue-600 hover:underline">
                            ⬇ Download QR Code
                        </a>
                    </div>

                </div>
            </div>

        </div>

        <!-- HISTORY -->
        <div class="bg-white p-6 sm:p-[30px] rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-800">History</h2>
                <button onclick="clearHistory()" id="clearHistoryBtn"
                    class="text-sm text-red-600 hover:underline">
                    Clear All
                </button>
            </div>

            <div id="historyEmptyState" class="text-center text-gray-400 text-sm py-6">
                No links shortened yet. Your history will show up here.
            </div>

            <div id="historyList" class="flex flex-col gap-3"></div>
        </div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
